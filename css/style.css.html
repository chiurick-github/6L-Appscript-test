<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --success-bg: #dcfce7;
    --success-text: #166534;
    --local-bg: #fef3c7;
    --local-text: #92400e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand { font-weight: 700; font-size: 1.25rem; }
  .badge {
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.25rem 0.75rem;
    border-radius: 9999px;
  }
  .badge-local { background: var(--local-bg); color: var(--local-text); }
  .badge-gas { background: var(--success-bg); color: var(--success-text); }
  main { max-width: 880px; width: 100%; margin: 2.5rem auto; padding: 0 1.5rem; flex: 1; }
  .hero-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    margin-bottom: 1.5rem;
  }
  .hero-card h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
  .hero-card p { color: var(--muted); margin-bottom: 1.5rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .info-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
  }
  .info-card h3 { font-size: 0.95rem; color: var(--muted); margin-bottom: 0.5rem; }
  .info-card .value { font-size: 1.05rem; font-weight: 600; word-break: break-all; }
  .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1rem; }
  button {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--primary-hover); }
  .console-box {
    background: #0f172a;
    color: #e2e8f0;
    border-radius: 12px;
    padding: 1.25rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.875rem;
    min-height: 110px;
    white-space: pre-wrap;
  }
  footer {
    text-align: center;
    padding: 1.5rem;
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
    background: var(--card);
  }
</style>
